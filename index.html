<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePulse - Ultimate Streaming Hub</title>
    <meta name="description" content="CinePulse - Futuristic streaming experience. Watch thousands of HD/4K movies, TV series, anime, and cartoons with zero buffering and HUD player.">
    <meta name="theme-color" content="#050505">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Open Graph -->
    <meta property="og:title" content="CinePulse | Ultimate Streaming Hub">
    <meta property="og:description" content="Stream thousands of 4K Movies & TV Series in Next-Gen Interface.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://image.tmdb.org/t/p/w780/by8z9Fe8y7p4jo2YlW2SZDnptyT.jpg">
    
    <!-- Favicon: CinePulse Neon SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111317' stroke='%23ff5168' stroke-width='2'/%3E%3Cpath d='M4 16h5l2-6 3 12 3-8 2 2h7' fill='none' stroke='%2300dbe9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolygon points='13,11 19,16 13,21' fill='%23ff5168'/%3E%3C/svg%3E">
    
    <!-- Google Fonts Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Pro/Free Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
 
    <!-- Critical Pre-Hydration Baseline Styles to Eliminate Hard Refresh Layout Shift (CLS = 0) -->
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-void: #050505;
            --bg-primary: #050505;
            --bg-secondary: #111111;
            --brand: #E50914;
            --cyan: #00dbe9;
            --text-primary: #ffffff;
            --sidebar-width: 320px;
            --header-height: 80px;
            --font-heading: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        html {
            background-color: #050505;
            color: #ffffff;
            font-family: var(--font-body);
            scroll-behavior: smooth;
            color-scheme: dark;
        }
        body.pulse-theme {
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .site-container {
            max-width: 1560px;
            margin: 0 auto;
            display: flex;
            gap: 24px;
            padding: 24px;
            width: 100%;
        }
        .main-content {
            flex: 1;
            min-width: 0;
        }
        .sidebar {
            width: 320px;
            flex-shrink: 0;
        }
        /* Keep layout bounds fixed before assets load */
        .movie-card-thumb, .hero-carousel-slide {
            background-color: #1a1c20;
        }
        i.fas, i.far, i.fab {
            display: inline-block;
            min-width: 1em;
            text-align: center;
        }
        /* Suppress raw material icon text labels before webfont load */
        .material-symbols-outlined {
            font-size: 0 !important;
            color: transparent !important;
            user-select: none;
            overflow: hidden;
            display: inline-block;
        }
    </style>
</head>
<body class="pulse-theme">
    <div id="root"></div>
    <script type="module" src="/client/src/main.jsx"></script>
</body>
</html>
