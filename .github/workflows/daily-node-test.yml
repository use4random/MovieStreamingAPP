name: Daily Streaming Node Test

on:
  schedule:
    # Run every day at 00:00 UTC (12:00 AM UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual execution from the GitHub Actions tab

jobs:
  test-nodes:
    name: Test Streaming Nodes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Streaming Node Tests
        run: node scripts/test-nodes.js
